name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q breadcrumbs tests

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test breadcrumbs/assets/browser-extension/tests/worker.test.mjs breadcrumbs/assets/browser-extension/tests/ui.test.mjs

  macos-wheel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m venv "$RUNNER_TEMP/wheel-runtime"
      - run: '"$RUNNER_TEMP/wheel-runtime/bin/python" -m pip install dist/*.whl'
      - name: Installed wheel timer, recovery, CLI and resources
        env:
          BREADCRUMBS_HOME: ${{ runner.temp }}/breadcrumbs-smoke-home
        run: |
          cp scripts/smoke_installed_package.py "$RUNNER_TEMP/smoke_installed_package.py"
          cd "$RUNNER_TEMP"
          wheel-runtime/bin/python -I smoke_installed_package.py

  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install ".[dev]"
      - run: npm install --prefix .build-check --no-save --package-lock=false playwright@1.64.1
      - run: .build-check/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/test_browser_e2e.cjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv .build-check/wheel-runtime
      - run: .build-check/wheel-runtime/bin/python -m pip install dist/*.whl
      - name: Installed wheel commands and resources
        run: |
          mkdir -p .build-check/wheel-check
          cd .build-check/wheel-check
          ../wheel-runtime/bin/breadcrumbs --version
          ../wheel-runtime/bin/tlock --version
          ../wheel-runtime/bin/breadcrumbs browser path
          ../wheel-runtime/bin/python -c "from importlib.resources import files; assert (files('breadcrumbs') / 'assets/browser-extension/manifest.json').is_file()"
