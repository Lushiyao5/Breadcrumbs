[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlock"
version = "0.4.0"
description = "An 8-bit terminal focus timer with goals, reflections, and local history."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["textual>=1.0,<2.0"]
keywords = ["pomodoro", "timer", "tui", "terminal", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/SaroashDS/Tlock"
Repository = "https://github.com/SaroashDS/Tlock"
Issues = "https://github.com/SaroashDS/Tlock/issues"
Changelog = "https://github.com/SaroashDS/Tlock/releases"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tlock = "tlock.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tlock"]
